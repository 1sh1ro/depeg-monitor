name: Depeg monitor

# GitHub's shortest schedule is every 5 minutes, and runs are often late.
# For tighter timing, run the Docker loop on a machine you control.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending them"
        type: boolean
        default: false

# contents: read blocks pushing commits. actions: write is only the state cache.
permissions:
  contents: read
  actions: write

concurrency:
  group: depeg-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install .

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: depeg-monitor-state-${{ github.run_id }}
          restore-keys: |
            depeg-monitor-state-

      - name: Run once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RPC_ETHEREUM_URL: ${{ secrets.RPC_ETHEREUM_URL }}
          RPC_ARBITRUM_URL: ${{ secrets.RPC_ARBITRUM_URL }}
          RPC_BSC_URL: ${{ secrets.RPC_BSC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          args=(--config config.yaml --state .state/monitor_state.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m depeg_monitor "${args[@]}"

      - name: Save alert state
        if: always() && hashFiles('.state/monitor_state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state
          key: depeg-monitor-state-${{ github.run_id }}
